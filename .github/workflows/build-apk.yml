name: Build VietMovieTV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare Output APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VietMovieTV.apk

      - name: Upload VietMovieTV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietMovieTV-APK
          path: VietMovieTV.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VietMovie TV (Bản mới nhất)
          body: "Tự động đóng gói VietMovie TV v2.0 đa nguồn (KKPhim + OPhim + NguonC)."
          files: VietMovieTV.apk
          make_latest: true
